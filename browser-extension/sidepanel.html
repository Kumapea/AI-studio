<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><script>try{var t=localStorage.getItem('studio:theme');document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light')}catch(e){}</script><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI制片台</title><link rel="stylesheet" href="css/style.css"><style>
#shell{height:100vh;display:flex;flex-direction:column}.top{padding:12px 14px 10px;border-bottom:1px solid var(--line);background:var(--bg-card)}.brand{display:flex;align-items:center;gap:9px;font-weight:700}.brand img{width:28px;height:28px;object-fit:contain;border-radius:7px}.brand small{font-weight:400;color:var(--text-muted);margin-left:5px}.tabs{display:flex;gap:6px;margin-top:10px}.tab{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--text-secondary);padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px}.tab.active{background:var(--text-primary);color:var(--bg-card);border-color:var(--text-primary)}#main{flex:1;min-height:0;overflow:hidden}.view{display:none;height:100%;overflow:auto}.view.active{display:block}.view iframe{width:100%;height:100%;border:0;background:#fff}.prompt-wrap{padding:14px}.prompt-head{margin-bottom:12px}.prompt-head h2{margin:0 0 4px;font-size:18px}.prompt-head p{margin:0;color:var(--text-muted);font-size:12px}.scene-box{margin-bottom:12px}.scene-box label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}.scene-box textarea{width:100%;box-sizing:border-box;min-height:70px;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg-card);color:var(--text-primary);resize:vertical}.nav-row{display:flex;gap:7px;align-items:center;margin-top:10px}.nav-row .btn{flex:1}.ai-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.ai-actions .btn{flex:1;min-width:100px}.result{margin-top:12px}.result pre{white-space:pre-wrap;word-break:break-word;background:var(--bg-sunken);padding:11px;border-radius:7px;font-size:11px;line-height:1.55;max-height:280px;overflow:auto}.hint{color:var(--text-muted);font-size:12px;line-height:1.55}.status-line{font-size:12px}.status-line.ok{color:var(--success)}.status-line.err{color:var(--danger)}
</style></head><body><div id="shell"><div class="top"><div class="brand"><img src="assets/AI制片台-logo.png"><span>AI制片台</span><small>你说人话，AI懂影视</small></div><div class="tabs"><button class="tab active" data-view="prompt">提示词</button><button class="tab" data-view="script">剧本标注</button></div></div><main id="main"><section id="view-prompt" class="view active"><div class="prompt-wrap"><div class="prompt-head"><h2>提示词精修</h2><p>大白话 → 影视执行级 Prompt。你写了什么场景、时间、人物位置，AI就围绕什么拍。</p></div><div id="view-prompt-body"></div></div></section><section id="view-script" class="view"><iframe src="modules/script-tagging/index.html" title="剧本标注工作台"></iframe></section></main></div><script src="js/db.js"></script><script src="js/theme.js"></script><script src="js/handoff.js"></script><script src="js/prompt-engine.js"></script><script>
(function(){var tabs=[].slice.call(document.querySelectorAll('.tab'));function go(name){tabs.forEach(function(t){t.classList.toggle('active',t.dataset.view===name)});document.querySelectorAll('.view').forEach(function(v){v.classList.toggle('active',v.id==='view-'+name)});try{localStorage.setItem('studio:lastView',name)}catch(e){}}tabs.forEach(function(t){t.onclick=function(){go(t.dataset.view)}});PromptEngine.render();try{var last=localStorage.getItem('studio:lastView');if(last==='script'||last==='prompt')go(last)}catch(e){}})();
</script></body></html>
